name: Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WAILS_VERSION: v2.13.0
  NODE_VERSION: "22"

jobs:
  test:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/desktop/frontend/package-lock.json
            prototype/web/package-lock.json

      - name: Test tracked artifact policy
        run: node --test scripts/ci/tracked-artifact-policy.test.mjs

      - name: Enforce tracked artifact policy
        run: node scripts/ci/tracked-artifact-policy.mjs

      - name: Install desktop frontend dependencies
        run: npm ci
        working-directory: apps/desktop/frontend

      - name: Test desktop frontend
        run: npm test -- --run
        working-directory: apps/desktop/frontend

      - name: Type-check desktop frontend
        run: npm run typecheck
        working-directory: apps/desktop/frontend

      - name: Build desktop frontend for Go embed
        run: npm run build
        working-directory: apps/desktop/frontend

      - name: Run Go race tests
        run: go test -count=1 -race -shuffle=on -timeout=5m ./apps/desktop ./internal/...

      - name: Vet Go packages
        run: go vet ./apps/desktop ./internal/...

      - name: Install prototype dependencies
        run: npm ci
        working-directory: prototype/web

      - name: Verify accepted prototype
        run: |
          npm test -- --run
          npm run typecheck
          npm run build
        working-directory: prototype/web

  macos-build:
    name: macOS production build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Diagnose Wails toolchain
        run: wails doctor

      - name: Generate and verify Wails bindings
        run: |
          wails generate module
          node ../../scripts/ci/verify-wails-bindings.mjs
        working-directory: apps/desktop

      - name: Test legacy project migration on macOS
        run: go test -count=1 ./internal/testsupport/legacyproject ./internal/platform/projectfs ./internal/persistence/sqlite ./internal/application/workspace

      - name: Gate project lifecycle protection on macOS
        run: |
          go test -count=1 -run 'TestProjectLease' ./internal/platform/projectfs
          go test -count=1 -run 'Test(OpenReadOnly|ReadOnly)' ./internal/persistence/sqlite
          go test -count=1 -run 'Test(OpenProject.*|CreateRecoveryCopy|ReadOnlyWorkspace)' ./internal/application/workspace

      - name: Build macOS application
        run: wails build -clean -m
        working-directory: apps/desktop

      - name: Validate macOS application bundle
        env:
          BUILD_RUNNER_LABEL: macos-15
        run: |
          node scripts/ci/wails-build-artifact.mjs \
            --platform darwin \
            --build-dir apps/desktop/build/bin \
            --output apps/desktop/build/bin/build-manifest.json
          plutil -lint apps/desktop/build/bin/NovelStudio.app/Contents/Info.plist

      - name: Package macOS inspection artifact
        run: |
          mkdir -p apps/desktop/build/artifacts
          tar -czf apps/desktop/build/artifacts/NovelStudio-macos-arm64.tar.gz \
            -C apps/desktop/build/bin \
            NovelStudio.app \
            build-manifest.json
          tar -tzf apps/desktop/build/artifacts/NovelStudio-macos-arm64.tar.gz

      - name: Upload macOS inspection artifact
        uses: actions/upload-artifact@v7
        with:
          name: novel-studio-macos-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/build/artifacts/NovelStudio-macos-arm64.tar.gz
            apps/desktop/build/bin/build-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows-build:
    name: Windows production build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Diagnose Wails toolchain
        run: wails doctor

      - name: Generate and verify Wails bindings
        run: |
          wails generate module
          node ../../scripts/ci/verify-wails-bindings.mjs
        working-directory: apps/desktop

      - name: Build Windows application
        run: wails build -clean -m
        working-directory: apps/desktop

      - name: Validate Windows executable
        env:
          BUILD_RUNNER_LABEL: windows-2025
        run: >
          node scripts/ci/wails-build-artifact.mjs
          --platform windows
          --build-dir apps/desktop/build/bin
          --output apps/desktop/build/bin/build-manifest.json

      - name: Run Go tests on Windows
        run: go test -count=1 ./apps/desktop ./internal/...

      - name: Gate project lifecycle protection on Windows
        run: |
          go test -count=1 -run 'TestProjectLease' ./internal/platform/projectfs
          go test -count=1 -run 'Test(OpenReadOnly|ReadOnly)' ./internal/persistence/sqlite
          go test -count=1 -run 'Test(OpenProject.*|CreateRecoveryCopy|ReadOnlyWorkspace)' ./internal/application/workspace

      - name: Package Windows inspection artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/desktop/build/artifacts" | Out-Null
          Compress-Archive `
            -Path "apps/desktop/build/bin/NovelStudio.exe","apps/desktop/build/bin/build-manifest.json" `
            -DestinationPath "apps/desktop/build/artifacts/NovelStudio-windows-x64.zip"
          $archive = Get-Item "apps/desktop/build/artifacts/NovelStudio-windows-x64.zip"
          if ($archive.Length -le 0) {
            throw "Windows inspection artifact is empty"
          }
          Write-Host "Created $($archive.FullName) ($($archive.Length) bytes)"

      - name: Upload Windows inspection artifact
        uses: actions/upload-artifact@v7
        with:
          name: novel-studio-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/desktop/build/artifacts/NovelStudio-windows-x64.zip
            apps/desktop/build/bin/build-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
